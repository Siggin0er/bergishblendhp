name: Sync events from Google Calendar

on:
  schedule:
    - cron: "17 3 * * *"
  workflow_dispatch:

permissions:
  contents: write
  actions: write

concurrency:
  group: sync-events
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - run: pip install "icalendar>=6" recurring-ical-events

      - name: Import calendar
        env:
          GOOGLE_CALENDAR_ICS_URL: ${{ secrets.GOOGLE_CALENDAR_ICS_URL }}
        run: python .github/scripts/sync_events.py

      - name: Commit and deploy
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if [ -z "$(git status --porcelain website/events.json)" ]; then
            echo "events.json unchanged"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add website/events.json
          git commit -m "Update events from calendar"
          git push
          # Pushes mit GITHUB_TOKEN lösen keinen Pages-Workflow aus
          gh workflow run pages.yml --ref "${GITHUB_REF_NAME}"
